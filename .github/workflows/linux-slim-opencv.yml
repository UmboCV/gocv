name: Build-debian-slim-opencv
on:
  workflow_dispatch:
    inputs:
      debian:
        description: 'debian version (ex: 13)'
        required: true
        default: '13'
      opencv:
        description: 'opencv version (ex: 4.13.0)'
        required: true
        default: '4.13.0'

jobs:
  build-arm64:
    runs-on: [self-hosted, linux, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        run: DEBIAN_VERSION=${{ github.event.inputs.debian }} OPENCV_VERSION=${{ github.event.inputs.opencv }} ./github/build-debian-slim-arm64.sh
  build-amd64:
    runs-on: [self-hosted, linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        run: DEBIAN_VERSION=${{ github.event.inputs.debian }} OPENCV_VERSION=${{ github.event.inputs.opencv }} ./github/build-debian-slim-amd64.sh
  build-manifest:
    runs-on: [self-hosted, linux, X64]
    needs: [build-arm64, build-amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build manifest
        run: DEBIAN_VERSION=${{ github.event.inputs.debian }} OPENCV_VERSION=${{ github.event.inputs.opencv }} ./github/build-debian-slim-manifest.sh
